services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cleanflow
      POSTGRES_PASSWORD: cleanflow
      POSTGRES_DB: cleanflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cleanflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  pgadmin:
    image: dpage/pgadmin4:8
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@cleanflow.local
      PGADMIN_DEFAULT_PASSWORD: cleanflow
    ports:
      - "5050:80"
    depends_on:
      - db
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://cleanflow:cleanflow@db:5432/cleanflow
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://cleanflow:cleanflow@db:5432/cleanflow
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      - backend
      - redis
    command: celery -A app.tasks.celery_app worker --loglevel=info

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  pgadmin_data:
